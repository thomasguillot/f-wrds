name: FWrds
options:
  bundleIdPrefix: com.fwrds
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en-GB
packages:
  WrdsKit:
    path: ../WrdsKit
targets:
  FWrds:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: WrdsKit
    scheme:
      testTargets:
        - FWrdsAppTests
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: F Wrds
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        # Prevent a second instance: two processes means two keyboard event taps, and every trigger
        # would then expand twice.
        LSMultipleInstancesProhibited: true
        NSHumanReadableCopyright: "© 2026 Thomas Guillot · MIT-Licensed"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd "$SRCROOT/.." && swiftlint lint --quiet
          else
            echo "note: SwiftLint not installed; skipping lint (brew install swiftlint)."
          fi
    settings:
      base:
        PRODUCT_NAME: "F Wrds"
        PRODUCT_MODULE_NAME: FWrds
        PRODUCT_BUNDLE_IDENTIFIER: com.fwrds.app
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
  FWrdsAppTests:
    type: bundle.unit-test
    platform: macOS
    # Unhosted: the app sources under test (the engine and the two types it wraps, the snippet
    # editor's undo, the token serialiser) are compiled straight into the bundle, so the tests never
    # launch a second copy of the app and never need Accessibility or Input Monitoring.
    sources:
      - path: Tests
      - path: Sources/ExpansionEngine.swift
      - path: Sources/EngineDependencies.swift
      - path: Sources/KeystrokeMonitor.swift
      - path: Sources/TextInjector.swift
      - path: Sources/SnippetUndo.swift
      - path: Sources/TokenSerialiser.swift
      - path: Sources/TokenChip.swift
    dependencies:
      - package: WrdsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fwrds.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
